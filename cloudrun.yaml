apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chickmagnet-api
  labels:
    cloud.googleapis.com/location: europe-west2
    app: chickmagnet
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: europe-west2-docker.pkg.dev/gen-lang-client-0655097153/chickmagnet/backend:latest
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: ALLOW_DEV_AUTH
              value: "false"
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            timeoutSeconds: 3
            periodSeconds: 15
