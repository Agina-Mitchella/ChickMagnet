version: '3.8'

services:
  # The Express Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sol_handmade_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - MPESA_ENVIRONMENT=sandbox
      - MPESA_CONSUMER_KEY=daraja_mock_key
      - MPESA_CONSUMER_SECRET=daraja_mock_secret
      - MPESA_PASSKEY=bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919
      - MPESA_SHORTCODE=174379
      - RAILWAY_STORAGE_ENDPOINT=http://minio:9000
      - RAILWAY_STORAGE_ACCESS_KEY=minioadmin
      - RAILWAY_STORAGE_SECRET_KEY=minioadmin
      - RAILWAY_STORAGE_BUCKET=chickmagnet-storage
      - RAILWAY_VOLUME_MOUNT_PATH=/data/storage
      - RESEND_API_KEY=re_mock
      - GOOGLE_CLIENT_ID=google_mock
      - GOOGLE_CLIENT_SECRET=google_secret_mock
      - WEBPUSH_PUBLIC_KEY=webpush_pub_mock
      - WEBPUSH_PRIVATE_KEY=webpush_priv_mock
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - redis
      - minio

  # The BullMQ asynchronous queue worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sol_handmade_worker
    restart: always
    command: ["node", "dist/worker.cjs"]
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - RESEND_API_KEY=re_mock
      - RAILWAY_STORAGE_ENDPOINT=http://minio:9000
      - RAILWAY_STORAGE_ACCESS_KEY=minioadmin
      - RAILWAY_STORAGE_SECRET_KEY=minioadmin
      - RAILWAY_STORAGE_BUCKET=chickmagnet-storage
      - RAILWAY_VOLUME_MOUNT_PATH=/data/storage
    depends_on:
      - redis
      - minio

  # PostgreSQL database container
  postgres:
    image: postgres:16-alpine
    container_name: sol_handmade_postgres
    restart: always
    environment:
      - POSTGRES_USER=sol_user
      - POSTGRES_PASSWORD=sol_password
      - POSTGRES_DB=sol_handmades
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis instance for sessions, rate limiting, and BullMQ queues
  redis:
    image: redis:7-alpine
    container_name: sol_handmade_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # MinIO as local Cloudflare R2 / S3-compatible substitute for dev
  minio:
    image: minio/minio:latest
    container_name: sol_handmade_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
